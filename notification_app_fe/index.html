<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Priority Inbox</title>
    <style>
        @keyframes pulse-beacon {
            0%   { transform: scale(1);   opacity: 1; }
            50%  { transform: scale(1.5); opacity: 0.4; }
            100% { transform: scale(1);   opacity: 1; }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }
        #root { width: 100%; max-width: 750px; }
        .card:hover { transform: translateY(-3px) !important; }
        .card.placement:hover { box-shadow: 0 12px 24px -6px rgba(239,68,68,0.35) !important; }
        .card.result:hover { box-shadow: 0 12px 24px -6px rgba(59,130,246,0.35) !important; }
        .card.event:hover { box-shadow: 0 12px 24px -6px rgba(16,185,129,0.35) !important; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
